name: Build Windows Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x64, x86]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: ${{ matrix.architecture }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 keyboard pyinstaller

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --noconsole --onefile main.py

    - name: Rename Executable
      run: |
        Move-Item -Path dist\main.exe -Destination dist\EpicPenClone-${{ matrix.architecture }}.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EpicPenClone-Windows-${{ matrix.architecture }}
        path: dist\EpicPenClone-${{ matrix.architecture }}.exe
